apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: throttle-demo
  name: throttle-demo
spec:
  containers:
  - image: polinux/stress
    name: throttle-demo
    command: ["stress"]
    args: ["--cpu", "2"]
    resources:
      limits:
        cpu: "200m"
        memory: "100Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
